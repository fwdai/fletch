# dpkg path rules for every install into the image: passed to mmdebstrap as
# --dpkgopt for the base and persisted as /etc/dpkg/dpkg.cfg.d/fletch-excludes
# so layer installs obey them too. One rule per line, no spaces.

# Documentation. Copyright files stay (licences).
path-exclude=/usr/share/doc/*
path-include=/usr/share/doc/*/copyright
path-exclude=/usr/share/man/*
path-exclude=/usr/share/info/*
path-exclude=/usr/share/lintian/*

# Translations: the guest runs with LANG=C.UTF-8 (boxes::guest_env); gettext
# falls back to English without them. 54 MB.
path-exclude=/usr/share/locale/*

# Mesa's software GL and the LLVM it JITs with (184 MB). libgbm1, which every
# Chromium links, hard-depends on mesa-libgallium in trixie, but a headless
# browser never opens a GBM device, so the backend is never dlopen'ed (verified
# with LD_DEBUG on image 0.2.0). Vulkan validation layers and the lavapipe ICD
# go the same way.
path-exclude=/usr/lib/*/libLLVM*
path-exclude=/usr/lib/*/libz3.so*
path-exclude=/usr/lib/*/libgallium*
path-exclude=/usr/lib/*/dri/*
path-exclude=/usr/lib/*/libvulkan_lvp*
path-exclude=/usr/lib/*/libVkLayer*
path-exclude=/usr/share/vulkan/*
