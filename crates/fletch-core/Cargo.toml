[package]
name = "fletch-core"
# Fletch's one product version, shared with `src-tauri/tauri.conf.json`,
# `src-tauri/Cargo.toml` and `crates/fletch-host/Cargo.toml` — CI asserts all
# four agree. This is the version a paired client reads as `HostInfo.appVersion`
# (`remote::mod`), so a crate version of its own would report a number no
# release ever had. Bump all four together; see docs/RELEASING.md.
version = "0.8.0"
description = "The Fletch engine: agents, sandboxes, workspaces, workflows and the remote host, with no Tauri in the dependency graph"
authors = ["Alex Chaplinsky", "fwdai.org"]
license = "AGPL-3.0-only"
edition = "2021"
rust-version = "1.77"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Portable YAML export/import of workflow definitions (workflow/yaml.rs) and the
# frontmatter of agent slash commands (slash_commands.rs). 0.9 is feature-frozen
# but stable and is the round-trip serializer the workflows spec names.
serde_yaml = "0.9"
tokio = { version = "1", features = ["full"] }
thiserror = "2"
uuid = { version = "1", features = ["v4", "serde"] }
dirs = "5"
tracing = "0.1"
portable-pty = "0.8"
parking_lot = "0.12"
# `signal` for the process-group teardown; `user` for `getuid`/`getgid`, which
# the container launch needs to map a Linux host's ownership through a bind
# mount (`sandbox::container::util::linux_host_user`).
nix = { version = "0.29", features = ["signal", "user"] }
chrono = { version = "0.4", features = ["serde"] }
# Used outside `cfg(test)` too: the sandbox and the git distribution unpack into
# temp dirs before an atomic rename.
tempfile = "3"
rusqlite = { version = "0.31", features = ["bundled", "backup"] }
rusqlite_migration = "1"
reqwest = { version = "0.13", default-features = false, features = ["json", "form", "rustls"] }
base64 = "0.22"
# Portable git distribution (git_dist.rs): checksum-verify and unpack the
# pinned dugite-native tarball downloaded when no usable system git exists.
sha2 = "0.10"
flate2 = "1"
tar = "0.4"
# Paired-device remote access (`remote/`). `handshake` for the LAN listener,
# `connect` + `rustls-tls-webpki-roots` for the outbound relay link
# (`remote/relay.rs`), which dials a `wss://` URL and therefore does need a TLS
# backend — webpki roots rather than the platform store so the link behaves the
# same on every OS. The *payload* is still end-to-end encrypted by the Noise
# channel inside the WebSocket, not by TLS, so the same frames survive the relay
# unchanged (see docs/remote-protocol.md). Pinned to 0.27 for the same reason
# the desktop pins it: 0.30 moves to sha1 0.11 / digest 0.11 and rand 0.10,
# which would add a second copy of the whole hashing and RNG stack next to the
# sha2 0.10 and rand 0.9 already in the tree.
tokio-tungstenite = { version = "0.27", default-features = false, features = [
  "handshake",
  "connect",
  "rustls-tls-webpki-roots",
] }
# The wire protocol, shared with the desktop and the mobile app: the Noise
# channel (`Noise_XX_25519_ChaChaPoly_BLAKE2s`, the pattern the protocol doc
# fixes), the host key file, the relay proof and the relay's multiplexing
# framing. A path dependency rather than a workspace member, so each *binary*
# package keeps its own lockfile and the release workflow needs no change.
fletch-proto = { path = "../fletch-proto" }
# `sink` for `SinkExt` on the split WebSocket writer; nothing else in the crate
# needs the combinator zoo.
futures-util = { version = "0.3", default-features = false, features = ["std", "sink"] }
# Pairing codes and device tokens (`remote/auth.rs`).
rand = "0.9"
# The host's LAN addresses, for the pairing URL and the settings pane's
# "reachable at" line. Smallest interface-enumeration crate: libc on unix,
# windows-sys elsewhere, both already present.
if-addrs = "0.13"

# App-held secrets (secrets.rs) and the agent-credential probe (run_env.rs):
# release builds keep the GitHub / container tokens in the login Keychain via
# the in-process API — the same signed binary creates and reads the items, so
# access is silent. Both modules fall back to a file store off macOS.
[target.'cfg(target_os = "macos")'.dependencies]
security-framework = "3"

[dev-dependencies]
tempfile = "3"
# `test-util` unlocks the paused-time test clock (`#[tokio::test(start_paused)]`)
# the workflow attempt tests use to exercise spawn/turn/stall deadlines
# deterministically. Test-only (unioned with the runtime `full` feature); it
# activates no extra crates, so the lockfile is unchanged.
tokio = { version = "1", features = ["test-util"] }
