[package]
name = "fletch-host"
# Fletch's one product version, shared with `src-tauri/tauri.conf.json`,
# `src-tauri/Cargo.toml` and `crates/fletch-core/Cargo.toml` — CI asserts all
# four agree. It is what `fletch-host --version` and `fletch-host status` print,
# and the release job names this binary's archives from the same number. Bump
# all four together; see docs/RELEASING.md.
version = "0.7.32"
description = "The headless Fletch host: runs the engine with no window, controllable by a paired phone or desktop over LAN or relay"
authors = ["Alex Chaplinsky", "fwdai.org"]
license = "AGPL-3.0-only"
edition = "2021"
rust-version = "1.77"
# Puts the compile-time target triple in `env!("TARGET")`, which is how
# `update` names the release asset built for this machine (`build.rs`).
build = "build.rs"

[[bin]]
name = "fletch-host"
path = "src/main.rs"

[features]
default = ["qr"]
# The pairing QR code `pair` prints (`qrcode`). On by default — scanning is how
# a phone pairs without typing a link — but behind a flag so the binary still
# builds where the crate cannot be fetched: this package's lockfile is not
# committed (see /.gitignore), so an offline or read-only registry has to be
# able to drop the one dependency that is not already in the desktop's tree.
qr = ["qrcode"]

[dependencies]
# The engine. Everything this binary does beyond parsing arguments and serving
# the admin socket happens in here, through the same `host::boot` the desktop
# calls — no Tauri anywhere in the graph, which `cargo tree -i tauri` proves.
fletch-core = { path = "../fletch-core" }
# The wire protocol. Not used by the binary itself (the engine owns the
# listener); the end-to-end test dials the host with it, as a client would.
fletch-proto = { path = "../fletch-proto" }
# Argument parsing. Pinned to the 4.4 series rather than `4`: this package has
# no committed lockfile (see /.gitignore), so a narrow range is the only
# reproducibility the binary's own dependency has, and nothing here needs a
# later derive surface.
clap = { version = "~4.4", features = ["derive"] }
# The runtime the engine's background tasks belong to (`host::runtime`), plus
# the admin socket and the signal wait. `full` for the same reason the engine
# asks for it: the engine spawns blocking work, timers, processes and sockets
# through this one runtime.
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
# One small mutex over the sign-in session (`login.rs`); the same lock the
# engine uses everywhere.
parking_lot = "0.12"
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# The default data dir, resolved the same way the engine resolves the desktop's.
dirs = "5"
# The pairing QR (`pair`), rendered with half-block characters so it fits a
# terminal. `default-features = false` drops the `image` and `svg` renderers:
# the unicode one needs no feature and nothing here writes a file.
qrcode = { version = "0.14", default-features = false, optional = true }
# `update`: the GitHub release API and the three downloads. Same version and
# features as the engine's client (`crates/fletch-core/Cargo.toml`), so the
# binary carries one copy of reqwest and one TLS stack.
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }
# `update`, again: checksum the download, unpack the tarball, and verify the
# minisign signature against the key the desktop updater trusts. All four are
# already in the desktop's tree — `minisign-verify` is what
# `tauri-plugin-updater` itself verifies with, so the host checks releases the
# same way and with the same key.
sha2 = "0.10"
flate2 = "1"
tar = "0.4"
minisign-verify = "0.2"
base64 = "0.22"
# `service install` needs this process's uid for launchd's `gui/<uid>` domain,
# and `update` needs it again to kickstart the agent. The `user` feature only,
# out of the same crate the engine already uses to map container ownership.
nix = { version = "0.29", features = ["user"] }

[dev-dependencies]
tempfile = "3"
# The end-to-end test is a client: it dials the host's WebSocket, runs the
# Noise handshake and speaks the protocol's JSON frames.
# Same version and feature set the engine pins, so the test's client and the
# host's listener share one copy of the transport.
tokio-tungstenite = { version = "0.27", default-features = false, features = [
  "handshake",
  "connect",
  "rustls-tls-webpki-roots",
] }
futures-util = { version = "0.3", default-features = false, features = ["std", "sink"] }
