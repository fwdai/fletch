[package]
name = "fletch-mobile"
version = "0.1.0"
description = "Fletch mobile companion — a control panel for agents running on your Mac"
authors = ["Alex Chaplinsky", "fwdai.org"]
license = "AGPL-3.0-only"
edition = "2021"
rust-version = "1.77"

[lib]
name = "fletch_mobile_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# Thin by design: the only commands the app defines are the secure channel to
# the paired Mac (src/remote/), which has to live here — the webview never
# sees ciphertext, and iOS ATS would block a cleartext ws:// from it anyway.
# Everything else is a plugin: a settings file, local notifications, the
# fletch:// pairing deep link, and — in repo, because Tauri has none — APNs.
tauri = { version = "2", features = [] }
tauri-plugin-fs = "2"
tauri-plugin-notification = "2"
tauri-plugin-deep-link = "2"
tauri-plugin-push = { path = "plugins/push" }

# Secure channel: Noise over a plain WebSocket. rustls (not native-tls) so a
# wss:// relay works on iOS without an OpenSSL build.
snow = "0.10"
tokio-tungstenite = { version = "0.27", features = ["rustls-tls-webpki-roots"] }
# tokio-tungstenite's rustls feature brings no crypto backend of its own, and
# rustls panics at the first `wss://` dial unless exactly one is compiled in or
# installed — inside a Tauri command that is an `invoke` that never resolves,
# which is how a relay dial used to leave the Pair screen on "Pairing…" for
# good. `ring`: already in the tree via `snow`, and it builds for iOS without
# cmake. `run()` also installs it explicitly, so a future dependency that
# drags in aws-lc-rs cannot reintroduce the ambiguity.
rustls = { version = "0.23", default-features = false, features = ["ring"] }
tokio = { version = "1", features = ["sync", "time"] }
futures-util = "0.3"
base64 = "0.22"
serde = { version = "1", features = ["derive"] }
# `generate_context!` expands to serde_json for the capability scopes.
serde_json = "1"

[target.'cfg(target_os = "ios")'.dependencies]
# `with_webview` hands out the raw WKWebView; objc2 is how we say anything to
# it. Already in the tree via tauri, so this pins nothing new.
objc2 = "0.6"

[dev-dependencies]
# The connect budget is async, so the test that drives it needs a runtime.
tokio = { version = "1", features = ["rt", "time"] }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
