[package]
name = "fletch-mobile"
version = "0.1.0"
description = "Fletch mobile companion — a control panel for agents running on your Mac"
authors = ["Alex Chaplinsky", "fwdai.org"]
license = "AGPL-3.0-only"
edition = "2021"
rust-version = "1.77"

[lib]
name = "fletch_mobile_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# Thin by design: the only commands the app defines are the secure channel to
# the paired Mac (src/remote/), which has to live here — the webview never
# sees ciphertext, and iOS ATS would block a cleartext ws:// from it anyway.
# Everything else is a plugin: a settings file, local notifications, the
# fletch:// pairing deep link, and — in repo, because Tauri has none — APNs.
tauri = { version = "2", features = [] }
tauri-plugin-fs = "2"
tauri-plugin-notification = "2"
tauri-plugin-deep-link = "2"
tauri-plugin-push = { path = "plugins/push" }

# Secure channel: Noise over a plain WebSocket. rustls (not native-tls) so a
# wss:// relay works on iOS without an OpenSSL build.
snow = "0.10"
tokio-tungstenite = { version = "0.27", features = ["rustls-tls-webpki-roots"] }
tokio = { version = "1", features = ["sync", "time"] }
futures-util = "0.3"
base64 = "0.22"
serde = { version = "1", features = ["derive"] }
# `generate_context!` expands to serde_json for the capability scopes.
serde_json = "1"

[target.'cfg(target_os = "ios")'.dependencies]
# `with_webview` hands out the raw WKWebView; objc2 is how we say anything to
# it. Already in the tree via tauri, so this pins nothing new.
objc2 = "0.6"

[dev-dependencies]
# The connect budget is async, so the test that drives it needs a runtime.
tokio = { version = "1", features = ["rt", "time"] }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

# iOS 27 refuses to launch apps built with its SDK unless they adopt the
# UIScene lifecycle. tao grew scene support in 0.36/0.37, but no published
# tauri release ships the tao 0.37 bump yet — it only exists on tauri's dev
# branch. Pin the whole tauri stack to one rev of that branch (mixed
# crates.io/git tauri crates would duplicate types) until the next tauri
# release, then delete this section.
[patch.crates-io]
tauri = { git = "https://github.com/tauri-apps/tauri", rev = "7f2b7cb7921caf7d9370b7ebe99e3cf47dbcfed6" }
tauri-build = { git = "https://github.com/tauri-apps/tauri", rev = "7f2b7cb7921caf7d9370b7ebe99e3cf47dbcfed6" }
tauri-codegen = { git = "https://github.com/tauri-apps/tauri", rev = "7f2b7cb7921caf7d9370b7ebe99e3cf47dbcfed6" }
tauri-macros = { git = "https://github.com/tauri-apps/tauri", rev = "7f2b7cb7921caf7d9370b7ebe99e3cf47dbcfed6" }
tauri-plugin = { git = "https://github.com/tauri-apps/tauri", rev = "7f2b7cb7921caf7d9370b7ebe99e3cf47dbcfed6" }
tauri-runtime = { git = "https://github.com/tauri-apps/tauri", rev = "7f2b7cb7921caf7d9370b7ebe99e3cf47dbcfed6" }
tauri-runtime-wry = { git = "https://github.com/tauri-apps/tauri", rev = "7f2b7cb7921caf7d9370b7ebe99e3cf47dbcfed6" }
tauri-utils = { git = "https://github.com/tauri-apps/tauri", rev = "7f2b7cb7921caf7d9370b7ebe99e3cf47dbcfed6" }
