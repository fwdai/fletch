name: Build and test the box image
description: >
  Runs packaging/box-image/build-docker.sh --test, the same build as on a Mac:
  fletch-guest, the images (build.sh in a privileged Debian container of the
  runner's architecture), their tests (test.sh), the delta manifests and an
  install with the app's installer. Puts report.md in the job summary.
  Publishes nothing. Needs an arm64 or x86-64 Linux runner; the images are for
  its architecture.
inputs:
  version:
    description: Image version (semver); default the VERSION file
    required: false
    default: ""
  with-agents:
    description: Install the agent CLIs in the tests ("1" or "0")
    required: false
    default: "1"
  out:
    description: Output directory
    required: false
    default: ${{ runner.temp }}/box-image
outputs:
  out:
    description: The output directory with the images, manifest.json, *.chunks.json, sizes.md, report.md
    value: ${{ inputs.out }}
  version:
    description: The version built
    value: ${{ steps.version.outputs.version }}
runs:
  using: composite
  steps:
    - id: version
      shell: bash
      run: |
        set -euo pipefail
        VERSION="${{ inputs.version }}"
        [ -n "$VERSION" ] || VERSION=$(cat packaging/box-image/VERSION)
        echo "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$' || { echo "::error::version must be semver, got '$VERSION'"; exit 1; }
        echo "version=$VERSION" >> "$GITHUB_OUTPUT"

    - name: Install Rust
      shell: bash
      run: rustup toolchain install

    - name: Cache cargo
      uses: Swatinem/rust-cache@v2
      with:
        workspaces: |
          crates/fletch-guest
          crates/fletch-box

    - name: Kernel modules for the tests
      shell: bash
      run: |
        sudo modprobe erofs || true
        sudo modprobe overlay || true
        grep -E "erofs|overlay" /proc/filesystems

    - name: Build and test the images
      shell: bash
      env:
        OUT: ${{ inputs.out }}
        VERSION: ${{ steps.version.outputs.version }}
        WITH_AGENTS: ${{ inputs.with-agents }}
      run: packaging/box-image/build-docker.sh --test "$OUT" "$VERSION"

    - name: Summary
      if: always()
      shell: bash
      env:
        OUT: ${{ inputs.out }}
      run: |
        {
          echo "## Box image ${{ steps.version.outputs.version }} ($(uname -m))"
          echo
          if [ -f "$OUT/report.md" ]; then cat "$OUT/report.md"; else echo "The build failed before the tests ran."; fi
        } >> "$GITHUB_STEP_SUMMARY"
