name: Box image spike

# Builds the layered box image proposed in packaging/box-image/spike/README.md
# and runs its checks in a privileged Debian container (loop mounts, overlayfs,
# chroot). Publishes nothing: the images, manifest and report are workflow
# artifacts, and the report is the job summary. Run it from Actions → Box image
# spike → Run workflow.
on:
  workflow_dispatch:
    inputs:
      with_agents:
        description: "Install the five agent CLIs in the chroot tests (about 1 GB of downloads)"
        type: boolean
        default: true
  # A workflow that exists only on a branch cannot be dispatched by hand, so a
  # push to a spike branch runs it with the agent installs on.
  push:
    branches: ["spike/**"]
    paths:
      - "packaging/box-image/spike/**"
      - ".github/workflows/box-image-spike.yml"

jobs:
  spike:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        run: |
          rustup toolchain install
          rustup target add aarch64-unknown-linux-musl

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: crates/fletch-guest

      - name: Build fletch-guest
        # So the base boots on a Mac (boot-test.sh); the chroot tests do not need it.
        run: |
          cd crates/fletch-guest
          cargo build --quiet --release --target aarch64-unknown-linux-musl
          mkdir -p "$RUNNER_TEMP/guest"
          cp target/aarch64-unknown-linux-musl/release/fletch-guest "$RUNNER_TEMP/guest/"

      - name: Kernel modules on the runner
        run: |
          sudo modprobe erofs || true
          sudo modprobe overlay || true
          sudo modprobe loop || true
          grep -E "erofs|overlay" /proc/filesystems

      - name: Range requests on an existing release asset (A13)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eu
          TAG=$(gh release list --limit 50 --json tagName -q '.[].tagName' | grep '^box-image-v' | head -1 || true)
          if [ -z "$TAG" ]; then echo "no box-image release to probe" | tee range.txt; exit 0; fi
          URL=$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$TAG" -q '.assets[] | select(.name == "base.erofs") | .url')
          # The API asset URL redirects to the CDN; a private repository needs the token on the first hop.
          CODE=$(curl -sS -L -o /dev/null -w '%{http_code}' -r 0-1023 -H "Accept: application/octet-stream" -H "Authorization: Bearer $GH_TOKEN" "$URL")
          echo "range request on $TAG base.erofs: HTTP $CODE (206 = ranges supported)" | tee range.txt
          test "$CODE" = 206

      - name: Build and test in a privileged Debian container
        env:
          WITH_AGENTS: ${{ (github.event_name == 'push' || inputs.with_agents) && '1' || '0' }}
        run: |
          mkdir -p "$RUNNER_TEMP/out"
          set +e
          docker run --rm --privileged --platform linux/arm64 \
            -v "$PWD/packaging/box-image:/src:ro" -v "$RUNNER_TEMP/guest:/guest:ro" -v "$RUNNER_TEMP/out:/out" \
            -e FLETCH_GUEST=/guest/fletch-guest -e WITH_AGENTS="$WITH_AGENTS" \
            -e "DEBIAN_SNAPSHOT=${DEBIAN_SNAPSHOT:-}" -e "SOURCE_DATE_EPOCH=${SOURCE_DATE_EPOCH:-}" \
            debian:trixie /src/spike/run.sh /out 0.0.0-spike
          echo "status=$?" >> "$GITHUB_OUTPUT"
          echo $? > "$RUNNER_TEMP/out/exit-code"
        id: spike

      - name: Summary
        if: always()
        run: |
          {
            echo "# Box image spike"
            echo
            [ -f range.txt ] && { echo "- A13: $(cat range.txt)"; echo; }
            [ -f "$RUNNER_TEMP/out/report.md" ] && cat "$RUNNER_TEMP/out/report.md" || { echo "no report: the build failed"; tail -50 "$RUNNER_TEMP/out/build.log" 2>/dev/null; }
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload images and report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: box-image-spike
          if-no-files-found: warn
          retention-days: 14
          path: |
            ${{ runner.temp }}/out/base.erofs
            ${{ runner.temp }}/out/layer-*.erofs
            ${{ runner.temp }}/out/manifest.json
            ${{ runner.temp }}/out/sizes.md
            ${{ runner.temp }}/out/report.md
            ${{ runner.temp }}/out/build.log
            ${{ runner.temp }}/out/test.log

      - name: Result
        if: always()
        run: test "$(cat "$RUNNER_TEMP/out/exit-code" 2>/dev/null)" = 0
