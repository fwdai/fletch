name: Box image

# Builds the box base image (packaging/box-image) and publishes it as the
# GitHub release `box-image-v<version>` holding `base.erofs` and
# `manifest.json`: the URL `fletch-box`'s ImageStore downloads from
# (`image_store::RELEASES_URL`). The app does not pick it up by itself: the
# hash in the binary is what a download is trusted against, so the pin is a
# reviewed commit, never fetched when the app is built. After publishing, the
# job runs `scripts/box-image-pin.sh` on the manifest it built, which rewrites
# `PinnedImage::{VERSION, SIZE, SHA256}`, and opens a pull request with that
# commit (the release body carries the same three values for pinning by
# hand). See packaging/box-image/README.md.
#
# Run it from Actions → Box image → Run workflow with the version, or push a
# tag `box-image-v<version>`. A version is published once: an app that has
# one `base.erofs` under a version treats it as installed, so the job refuses
# to touch an existing release.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Image version (semver X.Y.Z, e.g. 0.1.0); the release is box-image-v<version>"
        required: true
        type: string
  push:
    tags: ["box-image-v*"]

jobs:
  image:
    # The image is aarch64 and build.sh wants an aarch64 host, so the arm64
    # runner (free for public repos) builds it natively, no emulation.
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4

      - name: Version
        id: version
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" = push ]; then
            VERSION="${GITHUB_REF_NAME#box-image-v}"
          else
            VERSION="$INPUT_VERSION"
          fi
          if ! echo "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::version must be X.Y.Z, got '$VERSION'"
            exit 1
          fi
          if gh release view "box-image-v$VERSION" > /dev/null 2>&1; then
            echo "::error::release box-image-v$VERSION already exists; images are never republished under a version"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Install Rust
        # Toolchain from /rust-toolchain.toml, as in ci.yml. fletch-guest is a
        # static musl binary; on this arm64 host that is a native build.
        run: |
          rustup toolchain install
          rustup target add aarch64-unknown-linux-musl

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: crates/fletch-guest

      - name: Build the image
        # build-mac.sh is, despite its name, `cargo build` of fletch-guest plus
        # `docker run debian:trixie build.sh`, and both run natively on an arm64
        # Linux runner. Building inside the Debian container rather than on the
        # Ubuntu host keeps CI on the exact pipeline the README documents (the
        # same mmdebstrap, erofs-utils and Debian archive keyring a local build
        # uses), so a CI image is byte-identical to a local one with the same
        # inputs. DEBIAN_SNAPSHOT is the pin in build.sh unless given here.
        run: packaging/box-image/build-mac.sh "$RUNNER_TEMP/image" "${{ steps.version.outputs.version }}"

      - name: Release notes
        id: notes
        run: |
          set -euo pipefail
          M="$RUNNER_TEMP/image/manifest.json"
          NOTES="$RUNNER_TEMP/notes.md"
          {
            echo "Box base image for Fletch (\`packaging/box-image\`): the Debian root filesystem every box boots."
            echo
            echo "Pin for \`PinnedImage\` in \`crates/fletch-box/src/image_store/mod.rs\` (\`scripts/box-image-pin.sh ${GITHUB_REF_NAME:-box-image-v$(jq -r .version "$M")}\` writes it):"
            echo
            echo '```'
            jq -r '"VERSION = \"\(.version)\"\nSIZE    = \(.size)\nSHA256  = \"\(.sha256)\""' "$M"
            echo '```'
            echo
            echo "$(jq -r '.packages | length' "$M") packages (\`$(jq -r .arch "$M")\`), among them:"
            echo
            jq -r '.packages[] | select(test("^(node|chromium|git|python3|openssh-server|gcc|bash|curl|ripgrep|jq)="))
                   | "- `\(.)`"' "$M"
            echo
            echo "The full list with versions is in \`manifest.json\`; each package's licence is in the image under \`/usr/share/doc/<package>/copyright\`."
          } > "$NOTES"
          cat "$NOTES"
          echo "file=$NOTES" >> "$GITHUB_OUTPUT"

      - name: Publish the release
        # `gh`, as release.yml does for the host tarballs. `--latest=false`:
        # the app updater's endpoint serves the repository's *latest* release
        # (docs/RELEASING.md), and an image release must never become it.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >
          gh release create "box-image-v${{ steps.version.outputs.version }}"
          --target "$GITHUB_SHA"
          --title "Box image v${{ steps.version.outputs.version }}"
          --notes-file "${{ steps.notes.outputs.file }}"
          --latest=false
          "$RUNNER_TEMP/image/base.erofs"
          "$RUNNER_TEMP/image/manifest.json"

      - name: Open the pin pull request
        # The pin comes from the manifest just published, on a branch off the
        # checked-out commit, as a PR against the default branch. Needs
        # "Allow GitHub Actions to create and approve pull requests" (repository
        # Settings → Actions → General). GitHub does not run workflows for
        # events a GITHUB_TOKEN caused, so ci.yml does not start on this PR by
        # itself: close and reopen it, or push to it, to get the checks.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
          BASE: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          scripts/box-image-pin.sh "$RUNNER_TEMP/image/manifest.json"
          BRANCH="chore/pin-box-image-v$VERSION"
          TITLE="chore(box): pin box image v$VERSION"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git commit -am "$TITLE"
          git push origin "$BRANCH"
          BODY="$RUNNER_TEMP/pr.md"
          {
            echo "Pins the image published as release [box-image-v$VERSION]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/tag/box-image-v$VERSION) into \`PinnedImage\` (\`crates/fletch-box/src/image_store/mod.rs\`), written by \`scripts/box-image-pin.sh\` from its \`manifest.json\`."
            echo
            echo "Opened by the Box image workflow ($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID). CI does not start on a workflow-opened PR: close and reopen it, or push to it, before merging."
          } > "$BODY"
          gh pr create --base "$BASE" --head "$BRANCH" --title "$TITLE" --body-file "$BODY"
