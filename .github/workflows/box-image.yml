name: Box image

# Builds and tests the box images (packaging/box-image) and publishes them as
# the GitHub release `box-image-v<VERSION>` (the VERSION file): manifest.json,
# base.erofs, layer-*.erofs and the *.chunks.json delta manifests, which is
# what `fletch-box`'s ImageStore downloads. The app boots the version
# `PinnedImage::VERSION` names. See docs/box.md.
#
# - A pull request touching the image builds and tests it; nothing is published.
# - A push to main that touches it publishes the release for VERSION, unless
#   that release exists already (an image is never republished under a version).
# - Run workflow: build and test on any branch, publishing when asked.
# The weekly bump (box-image-bump.yml) publishes its own release the same way.
on:
  pull_request:
    paths:
      - "packaging/box-image/**"
      - "crates/fletch-guest/**"
      - ".github/workflows/box-image.yml"
      - ".github/actions/box-image/**"
  push:
    branches: [main]
    paths:
      - "packaging/box-image/**"
      - "crates/fletch-guest/**"
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish the release box-image-v<VERSION> (refused if it exists)"
        type: boolean
        default: false
      with_agents:
        description: "Install the agent CLIs in the tests (about 1 GB of downloads)"
        type: boolean
        default: true

jobs:
  image:
    # The image is aarch64 and build.sh wants an aarch64 host: the arm64 runner
    # builds it natively, no emulation.
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 120
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Build and test
        id: image
        uses: ./.github/actions/box-image
        with:
          with-agents: ${{ (github.event_name != 'workflow_dispatch' || inputs.with_agents) && '1' || '0' }}

      - name: Upload the images
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: box-image-${{ steps.image.outputs.version }}
          if-no-files-found: warn
          retention-days: 14
          path: |
            ${{ steps.image.outputs.out }}/*.erofs
            ${{ steps.image.outputs.out }}/*.chunks.json
            ${{ steps.image.outputs.out }}/manifest.json
            ${{ steps.image.outputs.out }}/sizes.md
            ${{ steps.image.outputs.out }}/report.md
            ${{ steps.image.outputs.out }}/test.log

      - name: Publish the release
        if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.publish)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OUT: ${{ steps.image.outputs.out }}
          VERSION: ${{ steps.image.outputs.version }}
        run: packaging/box-image/publish.sh "$OUT" "$VERSION"
