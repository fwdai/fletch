name: Box image

# Builds and tests the box images (packaging/box-image) and publishes them as
# the GitHub release `box-image-v<VERSION>` (the VERSION file) for aarch64 and
# `box-image-v<VERSION>-x86_64` for x86-64, one job per architecture on a
# runner of that architecture: manifest.json, base.erofs, layer-*.erofs and the
# *.chunks.json delta manifests, which is what `fletch-box`'s ImageStore
# downloads. The app boots the version `PinnedImage::VERSION` names. See
# docs/box.md.
#
# One rule holds throughout: a version names one set of inputs (publish.sh
# records the source tree ids in the release). So:
# - A pull request touching the image builds and tests it, and fails if VERSION
#   is already released from other inputs (bump VERSION); nothing is published.
# - A push to main that touches it publishes VERSION, or does nothing when the
#   release with these inputs exists (published from the branch, or by the bump).
# - Run workflow: build and test on any branch, publishing when asked.
# Every build is installed with the app's own installer before it can be
# published (build-docker.sh), and publish.sh makes a release public only once
# it carries every file.
on:
  pull_request:
    paths:
      - "packaging/box-image/**"
      - "crates/fletch-guest/**"
      - ".github/workflows/box-image.yml"
      - ".github/actions/box-image/**"
  push:
    branches: [main]
    paths:
      - "packaging/box-image/**"
      - "crates/fletch-guest/**"
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish the releases box-image-v<VERSION> and box-image-v<VERSION>-x86_64 (refused if they exist with other inputs)"
        type: boolean
        default: false
      with_agents:
        description: "Install the agent CLIs in the tests (about 1 GB of downloads)"
        type: boolean
        default: true

jobs:
  image:
    # build.sh builds for the machine it runs on: each runner builds its own
    # architecture natively, no emulation. Each release publishes on its own,
    # so one architecture's failure leaves the other's in place.
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: aarch64
            runner: ubuntu-24.04-arm
          - arch: x86_64
            runner: ubuntu-24.04
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: VERSION names these inputs
        # Before the build: a changed image under an already released VERSION
        # fails here, in minutes, rather than after merging.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: packaging/box-image/publish.sh --check "$(cat packaging/box-image/VERSION)" ${{ matrix.arch }}

      - name: Build and test
        id: image
        uses: ./.github/actions/box-image
        with:
          with-agents: ${{ (github.event_name != 'workflow_dispatch' || inputs.with_agents) && '1' || '0' }}

      - name: Upload the images
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: box-image-${{ steps.image.outputs.version }}-${{ matrix.arch }}
          if-no-files-found: warn
          retention-days: 14
          path: |
            ${{ steps.image.outputs.out }}/*.erofs
            ${{ steps.image.outputs.out }}/*.chunks.json
            ${{ steps.image.outputs.out }}/manifest.json
            ${{ steps.image.outputs.out }}/sizes.md
            ${{ steps.image.outputs.out }}/report.md
            ${{ steps.image.outputs.out }}/test.log

      - name: Publish the release
        if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.publish)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OUT: ${{ steps.image.outputs.out }}
          VERSION: ${{ steps.image.outputs.version }}
        run: packaging/box-image/publish.sh "$OUT" "$VERSION"
