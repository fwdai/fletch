name: Release

# Manual only. Bump `version` in src-tauri/tauri.conf.json, the three Cargo
# manifests (src-tauri, crates/fletch-core, crates/fletch-host) and
# package.json before running — `scripts/check-version.sh` is what asserts the
# first four agree, in CI and again in the `host` job below. This builds, signs, and
# notarizes a universal macOS app and creates a PUBLISHED GitHub release with
# the .dmg, the updater artifact (.app.tar.gz + .sig), and latest.json.
# Publishing makes it available to the in-app auto-updater.
#
# The `host` job then adds the headless `fletch-host` binaries to that same
# release, one tarball per target with a `.sha256` and a `.sig` beside it. It is
# deliberately a separate job: it shares nothing with the desktop build but the
# version number and the updater signing key, it needs no Apple identity, and a
# failure there must not take the app release with it.
on:
  workflow_dispatch:

jobs:
  release:
    permissions:
      contents: write
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.3"

      - name: Install Rust
        # Toolchain version + components come from /rust-toolchain.toml (single
        # source of truth; see ci.yml). Targets are release-only — both arches
        # are required so Tauri can lipo them into a universal binary — so they
        # stay here rather than in the shared toolchain file.
        run: |
          rustup toolchain install
          rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend dependencies
        run: bun install --frozen-lockfile

      # The box sandbox runtime (docs/boxes-spec.md) ships inside the app:
      # Helpers/fletch-vm and the two libkrun dylibs in Frameworks, staged by
      # packaging/box-bundle/prepare.sh from Tauri's beforeBundleCommand
      # (src-tauri/tauri.macos.conf.json). libkrun is arm64 only, so beside a
      # universal app these are arm64 files and an Intel Mac gets "unavailable"
      # from the runtime probe. The dylibs are built here, ahead of the Tauri
      # build, and cached: ensure.sh is a no-op when dist/ was built from the
      # same build.sh and patches, which is exactly the cache key. prepare.sh
      # refuses to build them itself in CI, so a broken cache fails loudly in
      # the bundle step instead of silently costing a minute.
      - name: Cache libkrun
        uses: actions/cache@v4
        with:
          path: packaging/libkrun/dist
          key: libkrun-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('packaging/libkrun/build.sh', 'packaging/libkrun/patches/*') }}

      - name: Build libkrun
        # Needs Xcode (bindgen wants libclang), which the macOS runner has.
        run: packaging/libkrun/ensure.sh

      - name: Import the signing certificate
        # prepare.sh signs fletch-vm and the dylibs with APPLE_SIGNING_IDENTITY
        # (hardened runtime, timestamp: what notarization checks) before Tauri
        # has imported the certificate — the Tauri CLI sets up its keychain in
        # the bundle step, after the hook has run. So the identity goes into a
        # keychain on the user search list here first, with the same `security`
        # sequence the Tauri CLI uses (tauri-macos-sign). Tauri still imports
        # its own copy later; the two do not interfere.
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          set -euo pipefail
          KEYCHAIN="$RUNNER_TEMP/fletch-box.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -hex 16)"
          echo "$APPLE_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/cert.p12" -P "$APPLE_CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign -k "$KEYCHAIN"
          security set-keychain-settings -t 3600 -u "$KEYCHAIN"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s \
            -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" > /dev/null
          # shellcheck disable=SC2046
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '" ')
          rm "$RUNNER_TEMP/cert.p12"
          security find-identity -v -p codesigning "$KEYCHAIN"

      - name: Build, sign, notarize and publish release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Updater artifact signing (minisign keypair generated for Fletch).
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # macOS code signing (Developer ID Application cert) + notarization.
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          # OAuth client keys, baked into the binary at compile time (see
          # src-tauri/src/oauth.rs). Add these as repository Actions secrets.
          QUORUM_GITHUB_CLIENT_ID: ${{ secrets.QUORUM_GITHUB_CLIENT_ID }}
          QUORUM_GOOGLE_CLIENT_ID: ${{ secrets.QUORUM_GOOGLE_CLIENT_ID }}
          QUORUM_GOOGLE_CLIENT_SECRET: ${{ secrets.QUORUM_GOOGLE_CLIENT_SECRET }}
          # Sentry DSN, baked in at compile time (see src-tauri/src/lib.rs).
          # Unset → error reporting is a no-op. Add as a repository secret.
          QUORUM_SENTRY_DSN: ${{ secrets.QUORUM_SENTRY_DSN }}
          # PostHog project key, baked in at compile time (see
          # src-tauri/src/telemetry.rs). Unset → telemetry is a no-op AND in-app
          # feedback has nowhere to go (docs/feedback.md). Add as a repository
          # secret. QUORUM_POSTHOG_HOST is only needed for a self-hosted
          # instance (defaults to PostHog US cloud).
          QUORUM_POSTHOG_KEY: ${{ secrets.QUORUM_POSTHOG_KEY }}
        with:
          tagName: v__VERSION__
          releaseName: Fletch v__VERSION__
          releaseBody: See the assets to download and install this version.
          releaseDraft: false
          prerelease: false
          tauriScript: bun run tauri
          args: --target universal-apple-darwin

      # The app as built: only Helpers/fletch-vm carries the hypervisor
      # entitlement and the runtime's signatures verify. No image argument:
      # hosted runners cannot boot a VM, so the boot half of the check is
      # skipped (packaging/box-bundle/README.md shows the full check for a Mac).
      - name: Check the box runtime in the app
        run: packaging/box-bundle/check.sh src-tauri/target/universal-apple-darwin/release/bundle/macos/Fletch.app

      # The release profile writes a `.dSYM` per architecture beside the
      # stripped binary (src-tauri/Cargo.toml). Attached to the release so a
      # crash report's `Fletch + 0x…` frames can be symbolicated by hand for
      # that exact version: `atos -o <dSYM>/Contents/Resources/DWARF/* -arch
      # arm64 -l <load address> <address>` (docs/debugging-crashes.md). The release is
      # already published, so a missing dSYM or failed upload only warns.
      - name: Attach debug symbols to the release
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=$(jq -r .version src-tauri/tauri.conf.json)
          OUT="$RUNNER_TEMP/Fletch-$VERSION-dSYMs"
          mkdir -p "$OUT"
          for ARCH in aarch64 x86_64; do
            DSYM="src-tauri/target/$ARCH-apple-darwin/release/fletch.dSYM"
            if [ -d "$DSYM" ]; then
              ditto "$DSYM" "$OUT/$ARCH/fletch.dSYM"
            else
              echo "::warning::no dSYM at $DSYM"
            fi
          done
          if [ -n "$(ls -A "$OUT")" ]; then
            ditto -c -k --keepParent "$OUT" "$OUT.zip"
            gh release upload "v$VERSION" "$OUT.zip" --clobber
          fi

      # Replace the placeholder release body with GitHub's auto-generated
      # release notes (the same "What's Changed" list the UI button produces),
      # built from PRs/commits since the previous release.
      - name: Generate release notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="v$(jq -r .version src-tauri/tauri.conf.json)"
          NOTES=$(gh api "repos/${{ github.repository }}/releases/generate-notes" \
            -f tag_name="$TAG" --jq .body)
          if [ -n "$NOTES" ] && [ "$NOTES" != "null" ]; then
            gh release edit "$TAG" --notes "$NOTES"
          fi

      # Kick off a Cloudflare Workers Builds deploy of the marketing site
      # (fwdai/quorum-web) so it rebuilds against the freshly published release.
      # WEB_DEPLOY_HOOK is the deploy-hook URL from the Worker's Settings > Builds.
      - name: Trigger website redeploy
        run: curl -fsS -X POST "${{ secrets.WEB_DEPLOY_HOOK }}"

  # `fletch-host`, the headless engine (crates/fletch-host/README.md): one
  # stripped tarball plus checksum per target, uploaded to the release the job
  # above published. Every target builds natively — no `cross`, no sysroot — so
  # each one is a plain `cargo build`:
  #
  #   x86_64-unknown-linux-gnu    ubuntu-latest
  #   aarch64-unknown-linux-gnu   ubuntu-24.04-arm   (GitHub's arm64 runner,
  #                                                   free for public repos)
  #   aarch64-apple-darwin        macos-latest       (Apple silicon)
  #
  # No apt step: the engine has no GTK, no WebKit and no OpenSSL in its graph
  # (which is what `cargo tree -i tauri` being empty is for), and its only
  # native build is SQLite, which `rusqlite`'s `bundled` feature compiles with
  # `cc` — everything needed is already on the runner images.
  host:
    needs: release
    permissions:
      contents: write
    strategy:
      # One target's failure leaves the others' assets on the release.
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-24.04-arm
          - target: aarch64-apple-darwin
            runner: macos-latest
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        # Toolchain version + components come from /rust-toolchain.toml, as in
        # ci.yml. The target is the runner's own, so this only names it for
        # `--target` to keep the output path predictable.
        run: |
          rustup toolchain install
          rustup target add ${{ matrix.target }}

      - name: Setup Bun
        # Only for `@tauri-apps/cli signer` in the signing step below; nothing
        # in this job builds a frontend.
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.3"

      - name: Install frontend dependencies
        # `@tauri-apps/cli` is already a devDependency (package.json), and
        # bun.lock is what pins the signer's version.
        run: bun install --frozen-lockfile

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: crates/fletch-host

      - name: Build
        env:
          # Baked in so `fletch-host github login` works out of the box; the
          # binary still prefers the runtime `$QUORUM_GITHUB_CLIENT_ID`, which
          # is how a host signs in as a different OAuth app (see login.rs).
          QUORUM_GITHUB_CLIENT_ID: ${{ secrets.QUORUM_GITHUB_CLIENT_ID }}
        run: >
          cargo build --release
          --manifest-path crates/fletch-host/Cargo.toml
          --target ${{ matrix.target }}

      - name: Package
        id: package
        run: |
          set -euo pipefail
          # The release's version — `src-tauri/tauri.conf.json`, which is what
          # the desktop job derived the tag `v__VERSION__` from — and the assert
          # that the three Cargo manifests say the same. The archive name and
          # the number inside the binary come from one source or this job does
          # not run: an archive called 0.7.32 holding a binary that reports
          # 0.1.0 is not something a user can be asked to reason about.
          VERSION="$(./scripts/check-version.sh)"
          NAME="fletch-host-$VERSION-${{ matrix.target }}"
          # This package is not in a workspace, so its target dir is its own.
          BIN="crates/fletch-host/target/${{ matrix.target }}/release/fletch-host"
          # And the binary itself: every target here builds natively, so the
          # freshly built one runs on this runner. `--version` prints
          # `fletch-host <version>`.
          BUILT="$("$BIN" --version | awk '{print $NF}')"
          if [ "$BUILT" != "$VERSION" ]; then
            echo "::error::fletch-host --version says $BUILT, this release is $VERSION"
            exit 1
          fi
          if [ "${{ runner.os }}" = "macOS" ]; then
            strip -x "$BIN"
          else
            strip "$BIN"
          fi
          # Flat tarball: `tar xzf … && install -Dm755 fletch-host ~/.local/bin/`
          # is what the README tells people to do, and the service units it
          # tells them to install travel with it.
          mkdir -p "stage/$NAME/packaging"
          cp "$BIN" crates/fletch-host/README.md "stage/$NAME/"
          cp packaging/fletch-host.service packaging/com.fletch.host.plist \
             "stage/$NAME/packaging/"
          tar -czf "$NAME.tar.gz" -C "stage/$NAME" .
          if command -v sha256sum >/dev/null; then
            sha256sum "$NAME.tar.gz" > "$NAME.tar.gz.sha256"
          else
            shasum -a 256 "$NAME.tar.gz" > "$NAME.tar.gz.sha256"
          fi
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"

      - name: Sign the tarball
        # The same minisign keypair the desktop's updater artifacts are signed
        # with, so the host verifies a release exactly the way the app does:
        # `fletch-host update` carries the matching public key as
        # `update::UPDATER_PUBKEY` (a test asserts it equals
        # `plugins.updater.pubkey` in src-tauri/tauri.conf.json) and refuses
        # any download whose `.sig` is missing or does not verify. Writes
        # `<tarball>.sig` beside the tarball.
        env:
          TAURI_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          TARBALL="${{ steps.package.outputs.name }}.tar.gz"
          bunx @tauri-apps/cli signer sign \
            -k "$TAURI_KEY" -p "$TAURI_KEY_PASSWORD" "$TARBALL"
          # An empty or absent signature is a release nobody can install, and
          # that must fail here rather than at the first `fletch-host update`.
          test -s "$TARBALL.sig"

      # `gh release upload`, not `softprops/action-gh-release`: the action
      # *patches* the release it is pointed at, and the job above has just
      # replaced that release's body with GitHub's generated notes. Adding
      # assets must not risk overwriting them, and `gh` (preinstalled on every
      # runner) does only that.
      - name: Upload to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >
          gh release upload ${{ steps.package.outputs.tag }}
          ${{ steps.package.outputs.name }}.tar.gz
          ${{ steps.package.outputs.name }}.tar.gz.sha256
          ${{ steps.package.outputs.name }}.tar.gz.sig
          --clobber
