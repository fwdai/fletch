name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.3"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      - name: Typecheck
        run: bun run check

      - name: Build
        run: bun run build

      - name: Test
        run: bun run test

  rust-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Plain apt, deliberately not `cache-apt-pkgs-action`. That action cached a
      # *failed* install: when Ubuntu's mirror served 404s for the versions its
      # index advertised, the action installed 0 of 4 packages, exited green, and
      # cached the empty result — after which every run on every branch restored a
      # 6 KB "cache", skipped installation, and failed later inside `glib-sys`.
      # Bumping the cache key only bought one run, because the key includes the
      # resolved package versions and those rotate.
      #
      # `update` immediately before `install` keeps the index and the pool in
      # step, and the retry rides out the mirror lag that caused the 404s. There
      # is no cache to poison, and a failed install fails the step.
      - name: Install system dependencies
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            if sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends \
                 libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev; then
              exit 0
            fi
            echo "::warning::apt attempt $attempt failed (likely mirror lag); retrying in 15s"
            sleep 15
          done
          echo "::error::apt failed three times; the GTK build dependencies are not installed"
          exit 1

      # Backstop, kept because it is what turned the silent-empty-install into a
      # legible failure in the first place: without it a missing GTK stack
      # surfaces two steps later as a pkg-config error from inside `glib-sys`.
      - name: Verify system dependencies
        run: pkg-config --exists --print-errors glib-2.0 gobject-2.0 gtk+-3.0 webkit2gtk-4.1

      - name: Setup Rust
        # Toolchain version + components come from /rust-toolchain.toml (the
        # single source of truth, shared with the release build and local dev).
        # rustup installs the pinned toolchain named there, with its components.
        run: rustup toolchain install

      # Separate packages, deliberately not a Cargo workspace (see
      # /.gitignore): `src-tauri` depends on `crates/fletch-core` (which depends
      # on `crates/fletch-proto`) by path, and each has its own lockfile, so
      # each needs its own cache entry.
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            src-tauri
            crates/fletch-core
            crates/fletch-proto
            crates/fletch-host

      - name: Rustfmt
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --check

      # Deny all warnings. This includes `await_holding_lock`, the guard for the
      # concurrency invariant this codebase relies on: a lock guard must never be
      # held across a blocking wait / await (see the rule on Supervisor::agents —
      # clone the Arc out and drop the lock before child I/O).
      # `significant_drop_tightening` stays opt-out: it fires on ~44 idiomatic
      # guard-at-scope-end sites across the tree, too noisy to gate on.
      - name: Clippy
        run: >
          cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets --
          -D warnings -A clippy::significant_drop_tightening

      - name: Test
        run: cargo test --manifest-path src-tauri/Cargo.toml

      # `fletch-core` is the engine, and it has no Tauri in its dependency
      # graph — which is the point of it, and why it gets its own gate rather
      # than riding along on the desktop's. This job runs on ubuntu-latest, so
      # these three steps are also the standing proof that the engine builds and
      # its tests pass on the platform the headless host targets, without a
      # webview anywhere in the tree.
      - name: Rustfmt (fletch-core)
        run: cargo fmt --manifest-path crates/fletch-core/Cargo.toml --check

      - name: Clippy (fletch-core)
        run: >
          cargo clippy --manifest-path crates/fletch-core/Cargo.toml --all-targets --
          -D warnings -A clippy::significant_drop_tightening

      - name: Test (fletch-core)
        run: cargo test --manifest-path crates/fletch-core/Cargo.toml

      # `fletch-proto` is the wire protocol both apps share, and it has no Tauri
      # in its dependency graph either — same reasoning, its own gate.
      - name: Rustfmt (fletch-proto)
        run: cargo fmt --manifest-path crates/fletch-proto/Cargo.toml --check

      - name: Clippy (fletch-proto)
        run: >
          cargo clippy --manifest-path crates/fletch-proto/Cargo.toml --all-targets --
          -D warnings -A clippy::significant_drop_tightening

      - name: Test (fletch-proto)
        run: cargo test --manifest-path crates/fletch-proto/Cargo.toml

      # `fletch-host` is the headless host binary. It runs on this job's
      # ubuntu-latest for the same reason the engine does: the Linux host is
      # what it is for, and its end-to-end test boots an engine, pairs a client
      # over the real Noise transport and revokes it — none of which may need a
      # webview, a window or a display.
      - name: Rustfmt (fletch-host)
        run: cargo fmt --manifest-path crates/fletch-host/Cargo.toml --check

      - name: Clippy (fletch-host)
        run: >
          cargo clippy --manifest-path crates/fletch-host/Cargo.toml --all-targets --
          -D warnings -A clippy::significant_drop_tightening

      - name: Test (fletch-host)
        run: cargo test --manifest-path crates/fletch-host/Cargo.toml
